<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
    <style>
      .pass  { fill:#e8f0fe; stroke:#4285f4; stroke-width:1.5; }
      .data  { fill:#fff7e6; stroke:#f5a623; stroke-width:1.5; }
      .lbl   { font-size:13.5px; font-weight:600; fill:#1a1a1a; }
      .sub   { font-size:10.5px; fill:#5f6368; }
      .flow  { stroke:#555; stroke-width:1.6; fill:none; marker-end:url(#arr3); }
      .title { font-size:17px; font-weight:700; fill:#1a1a1a; }
      .note  { font-size:11.5px; fill:#666; }
      .warn  { font-size:11.5px; fill:#b8860b; }
    </style>
  </defs>

  <text x="20" y="30" class="title">Word-expansion pipeline — WordExpander.ExpandToFields(Word)</text>

  <!-- input -->
  <rect x="14" y="70" width="92" height="60" rx="8" class="data"/>
  <text x="60" y="96" text-anchor="middle" class="lbl">Word</text>
  <text x="60" y="114" text-anchor="middle" class="sub">parts[]</text>

  <!-- passes -->
  <rect x="138" y="70" width="120" height="60" rx="8" class="pass"/>
  <text x="198" y="92" text-anchor="middle" class="lbl">1 · Tilde</text>
  <text x="198" y="110" text-anchor="middle" class="sub">~ → $HOME</text>
  <text x="198" y="123" text-anchor="middle" class="sub">(TildePart)</text>

  <rect x="290" y="70" width="150" height="60" rx="8" class="pass"/>
  <text x="365" y="90" text-anchor="middle" class="lbl">2 · Parameter /</text>
  <text x="365" y="105" text-anchor="middle" class="lbl">Command / Arith</text>
  <text x="365" y="122" text-anchor="middle" class="sub">$x ${..} $(..) $((..))</text>

  <rect x="472" y="70" width="130" height="60" rx="8" class="pass"/>
  <text x="537" y="92" text-anchor="middle" class="lbl">3 · Word split</text>
  <text x="537" y="110" text-anchor="middle" class="sub">on IFS — unquoted</text>
  <text x="537" y="123" text-anchor="middle" class="sub">results only</text>

  <rect x="634" y="70" width="120" height="60" rx="8" class="pass"/>
  <text x="694" y="92" text-anchor="middle" class="lbl">4 · Brace</text>
  <text x="694" y="110" text-anchor="middle" class="sub">{a,b} {1..5}</text>
  <text x="694" y="123" text-anchor="middle" class="sub">(per field)</text>

  <rect x="786" y="70" width="120" height="60" rx="8" class="pass"/>
  <text x="846" y="92" text-anchor="middle" class="lbl">5 · Glob</text>
  <text x="846" y="110" text-anchor="middle" class="sub">* ? [..]</text>
  <text x="846" y="123" text-anchor="middle" class="sub">unquoted fields</text>

  <!-- output -->
  <rect x="786" y="178" width="120" height="56" rx="8" class="data"/>
  <text x="846" y="202" text-anchor="middle" class="lbl">fields</text>
  <text x="846" y="220" text-anchor="middle" class="sub">List&lt;string&gt; (≥0)</text>

  <!-- arrows -->
  <path class="flow" d="M106,100 L136,100"/>
  <path class="flow" d="M258,100 L288,100"/>
  <path class="flow" d="M440,100 L470,100"/>
  <path class="flow" d="M602,100 L632,100"/>
  <path class="flow" d="M754,100 L784,100"/>
  <path class="flow" d="M846,130 L846,176"/>

  <!-- notes -->
  <rect x="14" y="256" width="892" height="68" rx="8" fill="#fafafa" stroke="#ddd"/>
  <text x="28" y="278" class="note">• Quoting is tracked per field (fieldGlob): brace/glob metacharacters that arrived inside quotes stay literal — <tspan font-family="Consolas,monospace">echo '*'</tspan> prints <tspan font-family="Consolas,monospace">*</tspan>.</text>
  <text x="28" y="297" class="note">• Fast paths short-circuit the common shapes: a lone literal with no metachars, and a lone <tspan font-family="Consolas,monospace">$var</tspan>/<tspan font-family="Consolas,monospace">${simple}</tspan> under default IFS.</text>
  <text x="28" y="316" class="warn">⚠ Divergence from canonical bash: GNU bash performs brace expansion FIRST (before all others); here it runs after word-splitting. See DECISIONS.</text>
</svg>
