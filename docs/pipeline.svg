<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
    <style>
      .stage  { fill:#e8f0fe; stroke:#4285f4; stroke-width:1.5; }
      .data   { fill:#fff7e6; stroke:#f5a623; stroke-width:1.5; }
      .lbl    { font-size:15px; font-weight:600; fill:#1a1a1a; }
      .sub    { font-size:11px; fill:#5f6368; font-family:Consolas,monospace; }
      .flow   { stroke:#555; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .title  { font-size:17px; font-weight:700; fill:#1a1a1a; }
      .note   { font-size:11.5px; fill:#666; }
      .frame  { fill:none; stroke:#bbb; stroke-width:1.2; stroke-dasharray:5 4; }
    </style>
  </defs>

  <text x="20" y="30" class="title">Four-stage pipeline — source text to execution</text>

  <!-- enclosing REPL/entry frame -->
  <rect x="14" y="48" width="952" height="150" rx="10" class="frame"/>
  <text x="24" y="66" class="note">Program.cs — entry / REPL loop · accumulates continuation lines · per-statement error isolation (Evaluator.RunStatement)</text>

  <!-- row of boxes: data / stage / data / stage / data / stage / data -->
  <!-- x positions -->
  <!-- source -->
  <rect x="24"  y="92" width="116" height="62" rx="8" class="data"/>
  <text x="82"  y="118" text-anchor="middle" class="lbl">source</text>
  <text x="82"  y="137" text-anchor="middle" class="sub">string</text>

  <rect x="180" y="92" width="116" height="62" rx="8" class="stage"/>
  <text x="238" y="118" text-anchor="middle" class="lbl">Lexer</text>
  <text x="238" y="137" text-anchor="middle" class="sub">Lexer/</text>

  <rect x="336" y="92" width="116" height="62" rx="8" class="data"/>
  <text x="394" y="118" text-anchor="middle" class="lbl">tokens</text>
  <text x="394" y="137" text-anchor="middle" class="sub">List&lt;Token&gt;</text>

  <rect x="492" y="92" width="116" height="62" rx="8" class="stage"/>
  <text x="550" y="118" text-anchor="middle" class="lbl">Parser</text>
  <text x="550" y="137" text-anchor="middle" class="sub">Parser/</text>

  <rect x="648" y="92" width="116" height="62" rx="8" class="data"/>
  <text x="706" y="118" text-anchor="middle" class="lbl">AST</text>
  <text x="706" y="137" text-anchor="middle" class="sub">Nodes.cs</text>

  <rect x="804" y="92" width="138" height="62" rx="8" class="stage"/>
  <text x="873" y="118" text-anchor="middle" class="lbl">Evaluator</text>
  <text x="873" y="137" text-anchor="middle" class="sub">Evaluator/</text>

  <!-- arrows -->
  <path class="flow" d="M140,123 L178,123"/>
  <path class="flow" d="M296,123 L334,123"/>
  <path class="flow" d="M452,123 L490,123"/>
  <path class="flow" d="M608,123 L646,123"/>
  <path class="flow" d="M764,123 L802,123"/>

  <!-- output below evaluator -->
  <path class="flow" d="M873,154 L873,210"/>
  <rect x="784" y="212" width="178" height="56" rx="8" class="data"/>
  <text x="873" y="236" text-anchor="middle" class="lbl">stdout · exit code</text>
  <text x="873" y="254" text-anchor="middle" class="sub">$? / process return</text>

  <text x="24" y="240" class="note">Evaluator collaborators:</text>
  <text x="24" y="258" class="sub">WordExpander · ArithParser · Builtins · ShellEnvironment</text>
  <text x="24" y="274" class="note">Interactive input layer: IO/LineEditor · History · CompletionEngine · PromptExpander</text>
</svg>
